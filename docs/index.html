<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排列五(含排列三)历史数据</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 彩种切换（置于最顶部） -->
        <div class="lottery-switch">
            <button class="switch-btn active" data-lottery="pl5" onclick="setLottery('pl5')">排列五(含排列三)</button>
            <button class="switch-btn" data-lottery="dlt" onclick="setLottery('dlt')">超级大乐透</button>
        </div>

        <header>
            <h1 id="pageTitle">排列五(含排列三)历史数据</h1>
            <p class="subtitle" id="pageSubtitle">2004-11-26 至 2026-10-09 | 共 7,735 期</p>
        </header>

        <!-- 搜索和筛选 -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索期号，如：26268">
                <button onclick="searchData()">搜索</button>
            </div>
            <div class="filter-box">
                <label>年份：</label>
                <select id="yearFilter" onchange="filterByYear()">
                    <option value="">全部</option>
                </select>
                <label>每页：</label>
                <select id="pageSize" onchange="changePageSize()">
                    <option value="20">20条</option>
                    <option value="50" selected>50条</option>
                    <option value="100">100条</option>
                </select>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-container" id="pl5TableContainer">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>期号</th>
                        <th>日期</th>
                        <th colspan="5" class="pl5-header">排列五（含排列三）</th>
                        <th>和值</th>
                        <th>跨度</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- 大乐透数据表格 -->
        <div class="table-container" id="dltTableContainer" hidden>
            <table id="dltTable">
                <thead>
                    <tr>
                        <th>期号</th>
                        <th>日期</th>
                        <th colspan="5" class="dlt-front-header">前区</th>
                        <th colspan="2" class="dlt-back-header">后区</th>
                        <th>和值</th>
                        <th>跨度</th>
                    </tr>
                </thead>
                <tbody id="dltTableBody"></tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination">
            <button onclick="prevPage()">上一页</button>
            <button onclick="jumpBack10()">前十页</button>
            <span id="pageInfo">第 1 页 / 共 155 页</span>
            <button onclick="nextPage()">下一页</button>
            <button onclick="jumpForward10()">下十页</button>
        </div>

        <!-- 统计图表 -->
        <div class="charts-section" id="chartsPl5">
            <h2>统计分析</h2>

            <div class="chart-row">
                <div class="chart-box">
                    <h3>各位号码频率统计</h3>
                    <canvas id="freqChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>和值分布</h3>
                    <canvas id="sumChart"></canvas>
                </div>
            </div>

            <div class="chart-row">
                <div class="chart-box">
                    <h3>跨度分布</h3>
                    <canvas id="spanChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>最近30期冷热号</h3>
                    <canvas id="hotColdChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 大乐透统计图表 -->
        <div class="charts-section" id="chartsDlt" hidden>
            <h2>统计分析</h2>

            <div class="chart-row">
                <div class="chart-box">
                    <h3>前区号码频率统计（01-35）</h3>
                    <canvas id="dltFrontFreqChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>前区和值分布</h3>
                    <canvas id="dltSumChart"></canvas>
                </div>
            </div>

            <div class="chart-row">
                <div class="chart-box">
                    <h3>前区跨度分布</h3>
                    <canvas id="dltSpanChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>后区号码频率统计（01-12）</h3>
                    <canvas id="dltBackFreqChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 遗漏值 -->
        <div class="omit-section">
            <h2 id="omitTitle">当前遗漏值（距离上次开出期数）</h2>
            <div class="omit-grid" id="omitGrid"></div>
        </div>
    </div>

    <script src="assets/data/data.js"></script>
    <script src="assets/data/data_p3.js"></script>
    <script src="assets/data/data_dlt.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
