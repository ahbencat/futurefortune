name: 更新彩票数据

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点执行
  workflow_dispatch:      # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 爬取排列五数据
        run: python scripts/fetch_lottery.py --type p5 --update

      - name: 派生排列三数据
        run: python scripts/derive_p3.py

      - name: 爬取大乐透数据
        run: python scripts/fetch_dlt.py --update

      - name: 爬取7星彩数据
        run: python scripts/fetch_lottery.py --type qxc --update

      - name: 更新 data.js
        run: |
          python3 -c "
          import json

          # 排列五数据
          with open('datas/pl5_all_data.json', 'r', encoding='utf-8') as f:
              p5_data = json.load(f)

          # 排列三数据
          with open('datas/pl3_all_data.json', 'r', encoding='utf-8') as f:
              p3_data = json.load(f)

          # 大乐透数据
          with open('datas/dlt_all_data.json', 'r', encoding='utf-8') as f:
              dlt_data = json.load(f)

          # 7星彩数据
          with open('datas/qxc_all_data.json', 'r', encoding='utf-8') as f:
              qxc_data = json.load(f)

          # 生成排列五 data.js
          with open('docs/assets/data/data.js', 'w', encoding='utf-8') as f:
              f.write('const LOTTERY_DATA = ')
              json.dump(p5_data, f, ensure_ascii=False, separators=(',', ':'))
              f.write(';\n')

          # 生成排列三 data.js
          with open('docs/assets/data/data_p3.js', 'w', encoding='utf-8') as f:
              f.write('const LOTTERY_DATA_P3 = ')
              json.dump(p3_data, f, ensure_ascii=False, separators=(',', ':'))
              f.write(';\n')

          # 生成大乐透 data.js
          with open('docs/assets/data/data_dlt.js', 'w', encoding='utf-8') as f:
              f.write('const LOTTERY_DATA_DLT = ')
              json.dump(dlt_data, f, ensure_ascii=False, separators=(',', ':'))
              f.write(';\n')

          # 生成7星彩 data.js
          with open('docs/assets/data/data_qxc.js', 'w', encoding='utf-8') as f:
              f.write('const LOTTERY_DATA_QXC = ')
              json.dump(qxc_data, f, ensure_ascii=False, separators=(',', ':'))
              f.write(';\n')

          print(f'排列五: {len(p5_data)} 条')
          print(f'排列三: {len(p3_data)} 条')
          print(f'大乐透: {len(dlt_data)} 条')
          print(f'7星彩: {len(qxc_data)} 条')
          "

      - name: 更新 README 数据概览
        run: |
          python3 -c "
          import json

          with open('datas/pl5_all_data.json', 'r', encoding='utf-8') as f:
              p5 = json.load(f)
          with open('datas/pl3_all_data.json', 'r', encoding='utf-8') as f:
              p3 = json.load(f)
          with open('datas/dlt_all_data.json', 'r', encoding='utf-8') as f:
              dlt = json.load(f)
          with open('datas/qxc_all_data.json', 'r', encoding='utf-8') as f:
              qxc = json.load(f)

          def stats(data):
              first, last = data[0], data[-1]
              return first['issue_no'], first['date'], last['issue_no'], last['date'], len(data)

          p3s, p3sd, p3e, p3ed, p3c = stats(p3)
          p5s, p5sd, p5e, p5ed, p5c = stats(p5)
          ds, dsd, de, ded, dc = stats(dlt)
          qs, qsd, qe, qed, qc = stats(qxc)

          HEADING = '## 📊 数据概览'

          def row(emoji, name, s, sd, e, ed, c):
              return f'| {emoji} **{name}** | {s} <sub>{sd}</sub> | **{e}** <sub>{ed}</sub> | **{c:,}** |'

          table = '\n'.join([
              '| 彩种 | 起始期号 | 最新期号 | 总期数 |',
              '| :--- | :--- | :--- | ---: |',
              row('🎱', '排列三', p3s, p3sd, p3e, p3ed, p3c),
              row('🎲', '排列五', p5s, p5sd, p5e, p5ed, p5c),
              row('🎯', '超级大乐透', ds, dsd, de, ded, dc),
              row('⭐', '7星彩', qs, qsd, qe, qed, qc),
          ])

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          start = content.index(HEADING)
          end = content.index('## ', start + len(HEADING))
          section = HEADING + '\n\n' + table + '\n\n> 数据来源：公开开奖数据 · 每日自动更新\n\n'
          content = content[:start] + section + content[end:]

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f'排列三: {p3c} 条 | 排列五: {p5c} 条 | 大乐透: {dc} 条 | 7星彩: {qc} 条')
          "

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datas/pl3_all_data.json datas/pl5_all_data.json datas/dlt_all_data.json datas/qxc_all_data.json \
            docs/assets/data/data.js docs/assets/data/data_p3.js docs/assets/data/data_dlt.js docs/assets/data/data_qxc.js \
            README.md
          git diff --staged --quiet || git commit -m "更新彩票数据 $(date +%Y-%m-%d)"
          git push
